# nginx: expose the time logger under https://your.domain/timelog
#
# Paste this INSIDE the existing `server { ... }` block that already terminates
# TLS for your domain — do not create a new server block, or you lose the
# certificate that Connect IQ requires.
#
#   sudo nano /etc/nginx/sites-available/your-site
#   sudo nginx -t && sudo systemctl reload nginx

location /timelog/ {
    proxy_pass http://127.0.0.1:8099/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The watch may hold a queue built up over days offline; the server makes one
    # Google API call per press, so a large batch legitimately takes a while.
    proxy_read_timeout 120s;

    # Connect IQ does not benefit from buffering and it delays small responses.
    proxy_buffering off;
}

# NOTE the trailing slashes on BOTH `location /timelog/` and `proxy_pass ...:8099/`.
# They are what strips the /timelog prefix, so the app sees /v1/events. Drop
# either one and every request 404s.
